<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Legacy Claim Management System</title>
  <link rel="stylesheet" href="/static/legacy.css" />
</head>
<body>
  <div class="frame">
    <div class="titlebar">Claim Management System &mdash; v{{ '2' if ui == 'v2' else '1' }}</div>
    <form class="claim-form" action="/submit" method="post">
      <input type="hidden" name="ui" value="{{ ui }}" />
      <label>Claim ID
        <input type="text" name="claim_id" value="{{ claim_id }}" />
      </label>
      <label>Amount
        <input type="text" name="amount" value="{{ amount }}" />
      </label>
      <label>Status
        <input type="text" name="status" value="Pending" readonly />
      </label>

      {% if ui == 'v2' %}
      <button type="submit" id="confirm-submit-btn" name="confirm_submit_claim">
        Confirm &amp; Submit Claim
      </button>
      {% else %}
      <button type="submit" id="submit-claim-btn" name="submit_claim">
        Submit Claim
      </button>
      {% endif %}
    </form>
  </div>
</body>
</html>
