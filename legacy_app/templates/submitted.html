<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Claim Submitted</title>
  <link rel="stylesheet" href="/static/legacy.css" />
</head>
<body>
  <div class="frame">
    <div class="titlebar">Claim Management System</div>
    <div class="result" id="result" data-status="SUBMITTED">
      <div class="result-badge">SUBMITTED</div>
      <p>Claim <strong id="result-claim-id">{{ claim_id }}</strong> has been recorded.</p>
      <p>Amount: <strong>{{ amount }}</strong></p>
    </div>
  </div>
</body>
</html>
